<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
<title id="t">Mehter · oyun şarkısı stili / song-video style</title>
<desc id="d">Banner for Mehter in the style of its song video: crimson ground, golden title, cream serif lettering, a red parade carpet with a blue hit line, a stylized mehter in a tall red-and-cream hat with a moustache, torches and a small drummer boy.</desc>
<defs>
<clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#686890"/><stop offset="1" stop-color="#E0A058"/></linearGradient>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#481810"/><stop offset=".6" stop-color="#481810" stop-opacity=".92"/><stop offset="1" stop-color="#481810" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="320" fill="#481810"/>
<rect x="640" width="640" height="190" fill="url(#sky)" opacity=".85"/>
<!-- street walls -->
<path d="M640 40 h160 v150 h-160 z" fill="#7a5a48"/><path d="M1120 30 h160 v160 h-160 z" fill="#7a5a48"/>
<g fill="#E02028"><path d="M690 40 h26 v70 l-13 -14 l-13 14 z"/><path d="M1180 30 h26 v70 l-13 -14 l-13 14 z"/></g>
<!-- torches -->
<g><rect x="662" y="120" width="6" height="50" fill="#402820"/><ellipse cx="665" cy="112" rx="9" ry="14" fill="#E0A058"/>
<rect x="1128" y="120" width="6" height="50" fill="#402820"/><ellipse cx="1131" cy="112" rx="9" ry="14" fill="#E0A058"/></g>
<!-- cobblestone and carpet -->
<rect y="190" width="1280" height="130" fill="#6a5a58"/>
<path d="M880 190 h200 l90 130 h-380 z" fill="#982018"/>
<path d="M898 190 h164 l76 130 h-316 z" fill="none" stroke="#D8A040" stroke-width="3" opacity=".8"/>
<rect x="800" y="296" width="360" height="5" rx="2" fill="#48b8ff"/>
<!-- mehter -->
<g>
<ellipse cx="980" cy="308" rx="60" ry="8" fill="#000" opacity=".3"/>
<path d="M928 296 q-6 -90 52 -92 q58 2 52 92 z" fill="#982018"/>
<path d="M968 204 h24 v92 h-24 z" fill="#E8D8B0" opacity=".9"/>
<path d="M934 262 q46 12 92 0" stroke="#D8A040" stroke-width="4" fill="none"/>
<circle cx="980" cy="168" r="30" fill="#D89068"/>
<path d="M944 168 q36 -26 72 0 l0 -34 q-36 -34 -72 0 z" fill="#F8F0D8"/>
<path d="M950 136 q30 -86 60 0 z" fill="#982018"/>
<circle cx="980" cy="104" r="7" fill="#D8A040"/>
<circle cx="968" cy="170" r="3.4" fill="#281808"/><circle cx="992" cy="170" r="3.4" fill="#281808"/>
<path d="M950 184 q30 -18 60 0 q-12 10 -30 4 q-18 6 -30 -4 z" fill="#403028"/>
<path d="M1040 120 v176" stroke="#D8A040" stroke-width="4"/><circle cx="1040" cy="116" r="8" fill="#D8A040"/>
</g>
<!-- drummer boy -->
<g>
<ellipse cx="880" cy="312" rx="30" ry="6" fill="#000" opacity=".3"/>
<rect x="858" y="262" width="44" height="42" rx="10" fill="#5a82b0"/>
<circle cx="880" cy="244" r="20" fill="#D89068"/>
<path d="M860 240 q20 -26 40 0 z" fill="#406a98"/>
<circle cx="873" cy="246" r="3" fill="#281808"/><circle cx="887" cy="246" r="3" fill="#281808"/>
<ellipse cx="880" cy="284" rx="26" ry="10" fill="#F8F0D8"/><rect x="854" y="284" width="52" height="16" fill="#C0402A"/>
</g>
<!-- falling petals -->
<g fill="#E02028" opacity=".7"><circle cx="720" cy="230" r="3"/><circle cx="1210" cy="250" r="3"/><circle cx="1090" cy="80" r="3"/></g>
</g>
<rect width="760" height="320" fill="url(#fade)" clip-path="url(#card)"/>
<g font-family="Georgia, 'Times New Roman', serif">
<text x="56" y="62" font-size="18" letter-spacing="3" fill="#F8F0D8">TURKISH IS EASY… ON THE BEAT?</text>
<rect x="56" y="72" width="360" height="3" fill="#E02028"/>
<text x="52" y="168" font-size="96" font-weight="700" letter-spacing="2" fill="#F8F0D8">MEHTER</text>
<text x="56" y="214" font-size="26" letter-spacing="1" fill="#D8A040">Ritmi tut, mehter yürüsün</text>
<text x="56" y="256" font-size="20" fill="#F8F0D8" opacity=".9">Davul, kös, zurna, zil: usul usul!</text>
<rect x="56" y="272" width="214" height="34" rx="17" fill="#D8A040"/>
<text x="163" y="295" font-size="17" font-weight="700" text-anchor="middle" fill="#481810">▶ OYNA · PLAY</text>
<text x="290" y="295" font-size="15" fill="#F8F0D8" opacity=".75">furkiozknn.github.io/mehter</text>
</g>
</svg>
